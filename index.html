
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dauns | Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 90%;
      max-width: 380px;
      padding: 40px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 12px;
    }

    .login img {
      display: block;
      max-width: 180px;
      max-height: 80px;
      object-fit: contain;
      margin: 0 auto 30px;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 6px;
      font-size: 14px;
    }

    input {
      background: #111;
      color: white;
      border: 1px solid #444;
    }

    button {
      background: white;
      color: #111;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ddd;
    }

    #mensagem {
      color: #ff7777;
      font-size: 13px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>

<body>
  <main class="login">
    <img src="./Dauns.webp" alt="Dauns">

    <h1>ACESSO RESTRITO</h1>

    <form id="loginForm">
      <input
        id="usuario"
        type="text"
        placeholder="Usuário"
        autocomplete="username"
        required
      >

      <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
        required
      >

      <button type="submit">ENTRAR</button>

      <p id="mensagem"></p>
    </form>
  </main>

  <script>
    const USUARIO = "daunsdigital";
    const SENHA = "dauns001@";

    // Se já estiver logado, abre a página inicial.
    if (sessionStorage.getItem("daunsLogado") === "sim") {
      window.location.replace("./Home.html");
    }

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const usuarioDigitado = document.getElementById("usuario").value.trim();
      const senhaDigitada = document.getElementById("senha").value;

      if (usuarioDigitado === USUARIO && senhaDigitada === SENHA) {
        sessionStorage.setItem("daunsLogado", "sim");
        window.location.replace("./Home.html");
      } else {
        document.getElementById("mensagem").textContent =
          "Usuário ou senha incorretos.";
      }
    });
  </script>
</body>
</html>
